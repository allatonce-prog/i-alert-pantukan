<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#DC2626">

    <title>Admin Registration - iAlert Pantukan</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card admin-card">
            <div class="auth-header">
                <div class="logo-container">
                    <div class="logo-icon admin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" />
                            <path d="M9 12l2 2 4-4" />
                        </svg>
                    </div>
                    <h1>Admin Registration</h1>
                </div>
                <p class="tagline">Department Administrator Setup</p>
            </div>

            <form id="adminRegisterForm" class="auth-form active">
                <div class="form-group">
                    <label for="adminName">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        Full Name
                    </label>
                    <input type="text" id="adminName" placeholder="Administrator Name" required>
                </div>

                <div class="form-group">
                    <label for="adminEmail">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        Official Email
                    </label>
                    <input type="email" id="adminEmail" placeholder="admin@department.gov.ph" required>
                </div>

                <div class="form-group">
                    <label for="adminPhone">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                        </svg>
                        Contact Number
                    </label>
                    <input type="tel" id="adminPhone" placeholder="+63 912 345 6789" required>
                </div>

                <div class="form-group">
                    <label for="adminDepartment">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <line x1="9" y1="3" x2="9" y2="21" />
                        </svg>
                        Department
                    </label>
                    <select id="adminDepartment" required>
                        <option value="">Select Department</option>
                        <option value="mdrrmc">🏥 MDRRMC (Medical, Rescue, Traffic)</option>
                        <option value="bfp">🔥 BFP (Fire Department)</option>
                        <option value="pnp">👮 PNP (Police & Traffic)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="adminStation">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                        Station/Office
                    </label>
                    <input type="text" id="adminStation" placeholder="Pantukan Central Station" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        Admin Password
                    </label>
                    <input type="password" id="adminPassword" placeholder="Create a secure password" required>
                </div>

                <div class="form-group">
                    <label for="adminToken">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path
                                d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3m-3-3l-2.5-2.5" />
                        </svg>
                        Department Access Token
                    </label>
                    <input type="password" id="adminToken" placeholder="Enter security token" required>
                </div>



                <button type="submit" class="btn btn-primary">
                    <span>Register Department Admin</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>

                <div class="auth-footer">
                    <p><a href="index.html">← Back to Login</a></p>
                </div>
            </form>
        </div>

        <!-- Alert Toast -->
        <div id="toast" class="toast"></div>

        <!-- Page Transition and Success Overlay -->
        <div id="pageTransition" class="page-transition-overlay">
            <div class="transition-container" id="transitionContainer">
                <div class="transition-loader"></div>
                <div class="transition-text">Syncing</div>
            </div>

            <div class="login-success-content" id="loginSuccessContent" style="display: none;">
                <div class="success-icon-lottie">
                    <svg viewBox="0 0 52 52" class="checkmark-svg">
                        <circle class="checkmark-circle-l" cx="26" cy="26" r="25" fill="none" />
                        <path class="checkmark-check-l" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                    </svg>
                </div>
                <h2 class="success-title">Account Created</h2>
                <p class="success-subtitle">Setting up your department dashboard...</p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/admin-auth.js"></script>
</body>

</html>
