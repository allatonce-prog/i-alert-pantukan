<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#DC2626">
    <meta name="description" content="iAlert Pantukan - Emergency Response System for Pantukan">

    <title>iAlert Pantukan - Emergency Response</title>

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" />
                            <path d="M12 8v8M8 12h8" />
                        </svg>
                    </div>
                    <h1>iAlert Pantukan</h1>
                </div>
                <p class="tagline">Emergency Response System</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">

                        Email
                    </label>
                    <input type="email" id="loginEmail" placeholder="your.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">

                        Password
                    </label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Sign In</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>


            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerName">

                        Full Name
                    </label>
                    <input type="text" id="registerName" placeholder="Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">

                        Email
                    </label>
                    <input type="email" id="registerEmail" placeholder="your.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="registerPhone">

                        Phone Number
                    </label>
                    <input type="tel" id="registerPhone" placeholder="+63 912 345 6789" required>
                </div>

                <div class="form-group">
                    <label for="registerAddress">

                        Address
                    </label>
                    <input type="text" id="registerAddress" placeholder="Street, Barangay, Pantukan" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">

                        Password
                    </label>
                    <input type="password" id="registerPassword" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Create Account</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- Alert Toast -->
        <div id="toast" class="toast"></div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.log('Service Worker registration failed', err));
        }
    </script>
</body>

</html>
