<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1E293B">

    <title>Super Admin Setup - iAlert Pantukan</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .super-card {
            border-top: 4px solid #6366F1;
        }

        .master-code-group {
            background: #F1F5F9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px dashed #6366F1;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card super-card">
            <div class="auth-header">
                <div class="logo-container">
                    <div class="logo-icon" style="background: #1E293B; color: #6366F1;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                            <circle cx="12" cy="11" r="3" />
                        </svg>
                    </div>
                    <h1 style="color: #1E293B;">Super Admin Setup</h1>
                </div>
                <p class="tagline">Initialization of Master Controls</p>
            </div>

            <form id="superRegisterForm" class="auth-form active">
                <div class="master-code-group">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="masterCode" style="color: #6366F1;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            Master Authorization Code
                        </label>
                        <input type="password" id="masterCode" placeholder="Enter System Master Key" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="superName">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        Full Name
                    </label>
                    <input type="text" id="superName" placeholder="Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label for="superEmail">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        Admin Email
                    </label>
                    <input type="email" id="superEmail" placeholder="super.admin@ialert.gov.ph" required>
                </div>

                <div class="form-group">
                    <label for="superPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        Create Password
                    </label>
                    <input type="password" id="superPassword" placeholder="Minimum 8 characters" required>
                </div>

                <button type="submit" class="btn btn-primary" style="background: #1E293B;">
                    <span>Initialize Super Admin</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>

                <div class="auth-footer">
                    <p><a href="index.html">← Back to Login</a></p>
                </div>
            </form>
        </div>

        <!-- Alert Toast -->
        <div id="toast" class="toast"></div>

        <!-- Page Transition and Success Overlay -->
        <div id="pageTransition" class="page-transition-overlay">
            <div class="transition-container" id="transitionContainer">
                <div class="transition-loader"></div>
                <div class="transition-text">Syncing</div>
            </div>

            <div class="login-success-content" id="loginSuccessContent" style="display: none;">
                <div class="success-icon-lottie">
                    <svg viewBox="0 0 52 52" class="checkmark-svg">
                        <circle class="checkmark-circle-l" cx="26" cy="26" r="25" fill="none" />
                        <path class="checkmark-check-l" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                    </svg>
                </div>
                <h2 class="success-title">Master Setup Complete</h2>
                <p class="success-subtitle">Redirecting to Super Admin Panel...</p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/super-admin-register.js"></script>
</body>

</html>
